<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">Isaiah Anson</title>
  <desc id="d">Endpoint, Mac and MDM support. Tier 2/3. Washington, D.C. metro. A branch graph that starts at one management point. The main line, labelled Work, runs through a laptop, a desktop and a phone, each with a check mark: Windows, Mac, Mobile. A side branch, labelled Side, runs through three project tiles: IT tools, AI agents, Game mods.</desc>
  <style>
    .bg { fill: #0d1117; }
    .edge { fill: none; stroke: #30363d; }
    .dot { fill: #8b949e; }
    .tile { fill: #161b22; stroke: #30363d; }
    .name { fill: #f0f6fc; }
    .role { fill: #c9d1d9; }
    .meta { fill: #8b949e; }
    .label { fill: #c9d1d9; }
    .ink { fill: none; stroke: #9aa4af; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .line { fill: none; stroke: #9aa4af; stroke-width: 2.4; stroke-linecap: round; }
    .ring { fill: #0d1117; stroke: #3fb8af; stroke-width: 2.4; }
    .acc { fill: none; stroke: #3fb8af; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .accfill { fill: #3fb8af; }
    .acctext { fill: #3fb8af; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle class="dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.18"/>
    </linearGradient>
    <mask id="m"><rect width="1280" height="320" fill="url(#fade)"/></mask>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="318" rx="16"/></clipPath>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="1279" height="319" rx="16"/>
  <g clip-path="url(#frame)"><rect width="1280" height="320" fill="url(#grid)" mask="url(#m)"/></g>
  <rect class="edge" x="0.5" y="0.5" width="1279" height="319" rx="16"/>

  <rect class="accfill" x="64" y="84" width="44" height="4" rx="2"/>
  <text class="name" x="62" y="158" font-size="60" font-weight="600" letter-spacing="-0.5">Isaiah Anson</text>
  <text class="role" x="64" y="204" font-size="26" font-weight="400">Endpoint, Mac and MDM support</text>
  <text class="meta" x="64" y="242" font-size="20" font-weight="400">Tier 2/3  ·  Washington, D.C. metro</text>

