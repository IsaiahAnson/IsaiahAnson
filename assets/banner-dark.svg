<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">Isaiah Anson</title>
  <desc id="d">Endpoint, Mac and MDM support. Tier 2/3. Washington, D.C. metro. A line drawing of a laptop, a desktop and a phone, each with a check mark, connected to one management point.</desc>
  <style>
    .bg { fill: #0d1117; }
    .edge { fill: none; stroke: #30363d; }
    .dot { fill: #8b949e; }
    .name { fill: #f0f6fc; }
    .role { fill: #c9d1d9; }
    .meta { fill: #8b949e; }
    .accent-fill { fill: #3fb8af; }
    .accent { fill: none; stroke: #3fb8af; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .device { fill: #0d1117; stroke: #8b949e; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .detail { fill: none; stroke: #8b949e; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle class="dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.2"/>
    </linearGradient>
    <mask id="m">
      <rect width="1280" height="320" fill="url(#fade)"/>
    </mask>
    <clipPath id="frame">
      <rect x="1" y="1" width="1278" height="318" rx="16"/>
    </clipPath>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="1279" height="319" rx="16"/>
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#grid)" mask="url(#m)"/>
  </g>
  <rect class="edge" x="0.5" y="0.5" width="1279" height="319" rx="16"/>

  <!-- text -->
  <rect class="accent-fill" x="64" y="84" width="44" height="4" rx="2"/>
  <text class="name" x="62" y="158" font-size="60" font-weight="600" letter-spacing="-0.5">Isaiah Anson</text>
  <text class="role" x="64" y="204" font-size="26" font-weight="400">Endpoint, Mac and MDM support</text>
  <text class="meta" x="64" y="242" font-size="20" font-weight="400">Tier 2/3  ·  Washington, D.C. metro</text>

  <!-- management tree -->
  <path class="accent" d="M988 88 V116 M850 148 V128 Q850 116 862 116 H1114 Q1126 116 1126 128 V140 M988 116 V138"/>
  <circle class="accent" cx="988" cy="74" r="13"/>
  <circle class="accent-fill" cx="988" cy="74" r="5"/>
  <circle class="accent-fill" cx="850" cy="148" r="3.5"/>
  <circle class="accent-fill" cx="988" cy="138" r="3.5"/>
  <circle class="accent-fill" cx="1126" cy="140" r="3.5"/>

  <!-- laptop -->
  <rect class="device" x="800" y="160" width="100" height="66" rx="7"/>
  <rect class="device" x="782" y="232" width="136" height="10" rx="5"/>
  <path class="accent" d="M840 193 l7 7 l13 -14"/>

  <!-- desktop -->
  <rect class="device" x="926" y="150" width="124" height="78" rx="9"/>
  <path class="detail" d="M978 228 V242 M998 228 V242 M958 244 H1018"/>
  <path class="accent" d="M978 189 l7 7 l13 -14"/>

  <!-- phone -->
  <rect class="device" x="1101" y="152" width="50" height="92" rx="10"/>
  <path class="detail" d="M1119 163 H1133"/>
  <path class="accent" d="M1116 199 l7 7 l13 -14"/>
</svg>
