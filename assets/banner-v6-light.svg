<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">Isaiah Anson</title>
  <desc id="d">Endpoint, Mac and MDM support. Tier 2/3. Washington, D.C. A branch graph that starts at one management point. The main line, labelled Work, runs through a laptop, a desktop and a phone, each with a check mark: Windows, Mac, Mobile. A side branch, labelled Side, runs through three project tiles: IT tools, AI agents, Game mods.</desc>
  <style>
    .bg { fill: #f6f8fa; }
    .edge { fill: none; stroke: #d0d7de; }
    .dot { fill: #59636e; }
    .name { fill: #1f2328; }
    .role { fill: #424a53; }
    .meta { fill: #59636e; }
    .label { fill: #424a53; }
    .ink { fill: none; stroke: #59636e; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .sB, .sT, .sV, .sO { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .sB { stroke: #0969da; } .sT { stroke: #0f766e; } .sV { stroke: #8250df; } .sO { stroke: #bc4c00; }
    .fB { fill: #0969da; } .fT { fill: #0f766e; } .fV { fill: #8250df; } .fO { fill: #bc4c00; }
    .tB, .tT, .tV, .tO { fill: #ffffff; stroke-opacity: 0.65; stroke-width: 1.4; }
    .tB { stroke: #0969da; } .tT { stroke: #0f766e; } .tV { stroke: #8250df; } .tO { stroke: #bc4c00; }
    .work { fill: none; stroke: #0969da; stroke-width: 2.4; stroke-linecap: round; }
    .side { fill: none; stroke: url(#sg); stroke-width: 2.4; stroke-linecap: round; }
    .ring { fill: #f6f8fa; stroke: #0969da; stroke-width: 2.4; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .draw { stroke-dasharray: 1; animation: draw 1.4s ease-out both; }
    .d2 { animation-delay: 0.25s; }
    .flow { stroke-width: 5; stroke-dasharray: 0.03 0.97; opacity: 0; animation: flow 5s linear 1.8s infinite; }
    .f2 { animation-delay: 3s; }
    .pop { animation: pop 0.55s ease-out both; }
    .p1 { animation-delay: 0.45s; } .p2 { animation-delay: 0.6s; } .p3 { animation-delay: 0.75s; }
    .p4 { animation-delay: 0.7s; } .p5 { animation-delay: 0.85s; } .p6 { animation-delay: 1s; }
    .pulse { fill: none; stroke: #0969da; stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-out 1.2s infinite; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes flow { 0% { stroke-dashoffset: 1; opacity: 0; } 6% { opacity: 1; } 92% { opacity: 1; } 100% { stroke-dashoffset: 0.03; opacity: 0; } }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0% { opacity: 0.6; transform: scale(1); } 70% { opacity: 0; transform: scale(2.3); } 100% { opacity: 0; transform: scale(2.3); } }
    @media (prefers-reduced-motion: reduce) { .draw, .flow, .pop, .pulse { animation: none; } }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle class="dot" cx="2" cy="2" r="1.1"/></pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/><stop offset="0.75" stop-color="#fff" stop-opacity="0.28"/><stop offset="1" stop-color="#fff" stop-opacity="0.18"/>
    </linearGradient>
    <mask id="m"><rect width="1280" height="320" fill="url(#fade)"/></mask>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="318" rx="16"/></clipPath>
    <radialGradient id="gb" cx="0.66" cy="0.05" r="0.42"><stop offset="0" stop-color="#0969da" stop-opacity="0.12"/><stop offset="1" stop-color="#0969da" stop-opacity="0"/></radialGradient>
    <radialGradient id="gv" cx="0.8" cy="1" r="0.4"><stop offset="0" stop-color="#8250df" stop-opacity="0.12"/><stop offset="1" stop-color="#8250df" stop-opacity="0"/></radialGradient>
    <radialGradient id="go" cx="1" cy="0.72" r="0.3"><stop offset="0" stop-color="#bc4c00" stop-opacity="0.12"/><stop offset="1" stop-color="#bc4c00" stop-opacity="0"/></radialGradient>
    <linearGradient id="sg" gradientUnits="userSpaceOnUse" x1="730" y1="0" x2="1150" y2="0">
      <stop offset="0" stop-color="#0f766e"/><stop offset="0.31" stop-color="#0f766e"/><stop offset="0.6" stop-color="#8250df"/><stop offset="0.88" stop-color="#bc4c00"/><stop offset="1" stop-color="#bc4c00"/>
    </linearGradient>
    <linearGradient id="ab" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0969da"/><stop offset="0.36" stop-color="#0f766e"/><stop offset="0.7" stop-color="#8250df"/><stop offset="1" stop-color="#bc4c00"/>
    </linearGradient>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="1279" height="319" rx="16"/>
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#gb)"/>
    <rect width="1280" height="320" fill="url(#gv)"/>
    <rect width="1280" height="320" fill="url(#go)"/>
    <rect width="1280" height="320" fill="url(#grid)" mask="url(#m)"/>
  </g>
  <rect class="edge" x="0.5" y="0.5" width="1279" height="319" rx="16"/>

  <rect x="64" y="84" width="84" height="4" rx="2" fill="url(#ab)"/>
  <text class="name" x="62" y="158" font-size="60" font-weight="600" letter-spacing="-0.5">Isaiah Anson</text>
  <text class="role" x="64" y="204" font-size="26" font-weight="400">Endpoint, Mac and MDM support</text>
  <text class="meta" x="64" y="242" font-size="20" font-weight="400">Tier 2/3  ·  Washington, D.C.</text>

  <path class="work draw" pathLength="1" d="M711 94 H1150"/>
  <path class="side draw d2" pathLength="1" d="M730 94 C768 94 762 206 800 206 H1150"/>
  <path class="work flow" pathLength="1" d="M711 94 H1150"/>
  <path class="side flow f2" pathLength="1" d="M730 94 C768 94 762 206 800 206 H1150"/>
  <circle class="pulse" cx="700" cy="94" r="11"/>
  <circle class="ring" cx="700" cy="94" r="11"/>
  <circle class="fT" cx="700" cy="94" r="4.5"/>
  <g class="pop p1"><rect class="tB" x="828" y="62" width="64" height="64" rx="12"/><rect class="ink" x="844" y="80" width="32" height="21" rx="3"/><rect class="ink" x="838" y="104" width="44" height="5" rx="2.5"/><path class="sB" d="M854 90 l4 4 l8 -9"/><text class="label" x="860" y="148" font-size="17" font-weight="500" text-anchor="middle">Windows</text></g>
  <g class="pop p2"><rect class="tB" x="948" y="62" width="64" height="64" rx="12"/><rect class="ink" x="961" y="77" width="38" height="25" rx="4"/><path class="ink" d="M976 102 V109 M984 102 V109 M969 110 H991"/><path class="sB" d="M974 89 l4 4 l8 -9"/><text class="label" x="980" y="148" font-size="17" font-weight="500" text-anchor="middle">Mac</text></g>
  <g class="pop p3"><rect class="tB" x="1068" y="62" width="64" height="64" rx="12"/><rect class="ink" x="1090" y="76" width="20" height="36" rx="5"/><path class="ink" d="M1097 82 H1103"/><path class="sB" d="M1095 96 l3.5 3.5 l7 -8"/><text class="label" x="1100" y="148" font-size="17" font-weight="500" text-anchor="middle">Mobile</text></g>
  <g class="pop p4"><rect class="tT" x="828" y="174" width="64" height="64" rx="12"/><path class="ink" d="M860 187 L876.5 196.5 V215.5 L860 225 L843.5 215.5 V196.5 Z"/><path class="sT" d="M843.5 196.5 L860 206 L876.5 196.5 M860 206 V225"/><text class="label" x="860" y="260" font-size="17" font-weight="500" text-anchor="middle">IT tools</text></g>
  <g class="pop p5"><rect class="tV" x="948" y="174" width="64" height="64" rx="12"/><rect class="ink" x="959" y="191" width="42" height="30" rx="5"/><path class="sV" d="M968 200 l7 6 l-7 6"/><path class="ink" d="M981 213 h11"/><text class="label" x="980" y="260" font-size="17" font-weight="500" text-anchor="middle">AI agents</text></g>
  <g class="pop p6"><rect class="tO" x="1068" y="174" width="64" height="64" rx="12"/><rect class="ink" x="1077" y="194" width="46" height="24" rx="12"/><path class="ink" d="M1088 201 v10 M1083 206 h10"/><circle class="fO" cx="1108" cy="210" r="2.6"/><circle class="fO" cx="1115" cy="203" r="2.6"/><text class="label" x="1100" y="260" font-size="17" font-weight="500" text-anchor="middle">Game mods</text></g>
  <text class="fB" x="1162" y="99.5" font-size="15" font-weight="600" letter-spacing="1.5">WORK</text>
  <text class="fO" x="1162" y="211.5" font-size="15" font-weight="600" letter-spacing="1.5">SIDE</text>
</svg>
